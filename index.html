<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Luiz Fernando Streme Vogel · Desenvolvedor full-stack</title>
    <meta
      name="description"
      content="Portfólio de Luiz Fernando Streme Vogel, desenvolvedor full-stack júnior com foco em automação e Power Platform, em Curitiba."
    />
    <script>
      // Aplica o tema antes da pintura: escolha salva > preferência do sistema.
      ;(function () {
        var saved = null
        try { saved = localStorage.getItem('tema') } catch (e) {}
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
